<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Friday 2026 Cycling Sales</title>
<style>
  :root {
    --bg: #fff;
    --fg: #1a1a1a;
    --muted: #666;
    --line: #e5e5e5;
    --head: #f7f7f7;
    --link: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #e8e8e8;
      --muted: #999;
      --line: #2c2c2c;
      --head: #1c1c1c;
      --link: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .controls {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg);
    padding: .5rem 0 .75rem;
  }
  .controls input[type=search] {
    width: 100%;
    font: inherit;
    font-size: 16px; /* below 16px, iOS zooms the page on focus */
    padding: .5rem .75rem;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .controls input[type=search]:focus { outline: 2px solid var(--link); outline-offset: -1px; }
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem 1.1rem;
    margin-top: .6rem; font-size: .9em;
  }
  .filters label { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; white-space: nowrap; }
  .filters input { margin: 0; accent-color: var(--link); }
  .filters .n { color: var(--muted); }
  .filters .sep { width: 1px; align-self: stretch; background: var(--line); }
  .count { color: var(--muted); font-size: .85em; margin-top: .5rem; }

  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .55rem .6rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    background: var(--head);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--link); }
  th::after { content: "\00a0↕"; color: var(--muted); font-size: .8em; }
  th[aria-sort="ascending"]::after { content: "\00a0↑"; color: inherit; }
  th[aria-sort="descending"]::after { content: "\00a0↓"; color: inherit; }
  .k-status, .k-detected { white-space: nowrap; }
  .k-website { white-space: nowrap; }
  .k-notes { min-width: 10rem; }
  .k-detected { color: var(--muted); }
  /* Colored labels for tags and types. Each label sets --h (a hue). */
  .label {
    display: inline-block;
    margin: 0 .25rem .2rem 0;
    padding: .05rem .5rem;
    font-size: .78em;
    line-height: 1.5;
    border-radius: 4px;
    background: hsl(var(--h) 75% 93%);
    color: hsl(var(--h) 60% 28%);
  }
  .label.tag { font-weight: 600; border-radius: 999px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    .label { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 75% 82%); }
  }
  .status { font-size: .85em; }
  .status::before { content: "●"; margin-right: .35em; }
  .s-live::before { color: #1f9d55; }
  .s-other_sale::before { color: #d69e2e; }
  .s-not_yet::before { color: #999; }
  .s-unknown::before { color: #999; content: "○"; }
  .s-closed::before { color: #c53030; }
  .msort { display: none; }
  .empty { color: var(--muted); padding: 1rem 0; }
  footer { color: var(--muted); font-size: .85em; margin-top: 1rem; }

  /* Price stats: a grid of categories with lowest / median / highest price. */
  #prices { margin: 0 0 1.25rem; }
  #prices summary { cursor: pointer; display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  #prices summary h2 { display: inline; font-size: 1.1rem; margin: 0; }
  #prices .psub { color: var(--muted); font-size: .85em; }
  .pstats {
    display: grid;
    grid-template-columns: minmax(12rem, 1.6fr) repeat(3, minmax(6.5rem, 1fr));
    margin-top: .6rem;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .pstats > div { padding: .5rem .6rem; border-bottom: 1px solid var(--line); min-width: 0; }
  .pstats .ph { background: var(--head); font-weight: 600; font-size: .9em; }
  .pstats .pgroup { grid-column: 1 / -1; background: var(--head); padding: .35rem .6rem; }
  .pstats .pcat .n, .pstats .pval .by, .pstats .pval .was { display: block; color: var(--muted); font-size: .8em; }
  .pstats .pval .was s { opacity: .9; }
  .pstats .pval .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pstats .pval .v.sale { color: #1f9d55; }
  .pstats .pnone { grid-column: 2 / -1; color: var(--muted); font-size: .9em; }
  .pstats .last { border-bottom: 0; }
  @media (max-width: 700px) {
    .pstats { grid-template-columns: repeat(3, 1fr); }
    .pstats .ph-cat { display: none; }
    .pstats .pcat { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 0; font-weight: 600; }
    .pstats .pcat .n { font-weight: 400; }
    .pstats .pnone { grid-column: 1 / -1; }
  }

  /* Narrow screens: each row becomes a card, and a dropdown replaces the header row for sorting. */
  @media (max-width: 1120px) {
    body { padding: 1.25rem 16px; }
    h1 { font-size: 1.3rem; }
    .filters .sep { display: none; }
    .wrap { overflow: visible; }
    table, thead, tbody { display: block; }

    thead { display: none; }
    .msort {
      display: flex; align-items: center; gap: .5rem;
      padding: .5rem .75rem;
      background: var(--head);
      border-bottom: 1px solid var(--line);
      font-size: .85em;
      color: var(--muted);
    }
    .msort select, .msort button {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .25rem .5rem;
    }
    .msort select { flex: 1 1 auto; min-width: 0; }
    .msort button { flex: none; cursor: pointer; min-width: 2.25rem; }
    .msort button:disabled { opacity: .4; cursor: default; }

    tbody tr {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: .3rem 1rem;
      padding: .8rem .75rem;
      border-bottom: 1px solid var(--line);
    }
    tbody tr:last-child { border-bottom: 0; }
    td { display: block; padding: 0; border: 0; min-width: 0; }
    td:empty { display: none; }

    /* Line 1: name and status. Line 2: notes. Line 3: everything else. */
    td.k-name { order: -2; flex: 1 1 auto; font-weight: 600; white-space: normal; }
    td.k-status { order: -1; flex: 0 0 auto; }
    td.k-notes { flex-basis: 100%; min-width: 0; }
    td.k-type { min-width: 0; }
    td:not(.k-name):not(.k-status):not(.k-notes) {
      order: 1;
      font-size: .82em;
      color: var(--muted);
      white-space: normal;
    }
    td:not(.k-name):not(.k-status):not(.k-notes):not(.k-website):not(.k-tags):not(.k-type)::before {
      content: attr(data-label) ": ";
      opacity: .8;
    }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p class="sub" id="sub"></p>
  <section id="prices" hidden>
    <details open>
      <summary><h2>Prices by category</h2><span class="psub" id="psub"></span></summary>
      <div class="pstats" id="pstats"></div>
    </details>
  </section>
  <div class="controls">
    <input id="q" type="search" placeholder="Search brands, notes, countries… (press /)" autocomplete="off" aria-label="Search">
    <div class="filters" id="filters">
      <span id="tagFilters" style="display:contents"></span>
      <span class="sep"></span>
      <label><input type="checkbox" id="saleOnly"> Show only brands with sales</label>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="wrap">
    <div class="msort">
      <label for="sortSel">Sort by</label>
      <select id="sortSel"></select>
      <button id="sortDir" type="button" aria-label="Reverse sort order">↑</button>
    </div>
    <table id="t"><thead><tr></tr></thead><tbody></tbody></table>
  </div>
  <p class="empty" id="empty" hidden>Nothing matches these filters.</p>
  <footer id="foot"></footer>
</main>
<script>
const DATA_URL = "data/brands.json";
const PRICES_URL = "data/prices.json";

// Columns, in order. `key` is the field in data/brands.json.
const COLUMNS = [
  { key: "name",     label: "Name" },
  { key: "tags",     label: "Tags" },
  { key: "website",  label: "Website" },
  { key: "status",   label: "Black Friday" },
  { key: "detected", label: "Sale detected" },
  { key: "type",     label: "Type" },
  { key: "notes",    label: "What's on the site" },
  { key: "country",  label: "Country" },
];

// Status values in sort order, with display labels.
const STATUSES = {
  live:       "Live now",
  other_sale: "Other sale on",
  not_yet:    "Not yet",
  unknown:    "Couldn't check",
  closed:     "Closed",
};
const STATUS_ORDER = Object.keys(STATUSES);
// Statuses that count as "some form of sale going on".
const ON_SALE = new Set(["live", "other_sale"]);

const $ = id => document.getElementById(id);
const rows = [];        // { el, data, idx, text, words }
const tags = [];        // { id, label, input, n }
const tagLabel = id => tags.find(t => t.id === id)?.label ?? id;

// Label colors. Tags take hues in order. Each distinct type gets the next hue
// in order of first appearance (after the ones tags use), so common types are
// distinct and the same type is always the same color.
const HUES = [212, 145, 28, 275, 345, 185, 48, 100, 240, 5, 310, 160];
const tagHue = id => HUES[Math.max(0, tags.findIndex(t => t.id === id)) % HUES.length];
const typeHues = new Map();
function typeHue(text) {
  const k = norm(text);
  if (!typeHues.has(k)) typeHues.set(k, HUES[(typeHues.size + 4) % HUES.length]);
  return typeHues.get(k);
}
// A brand's type can hold several values separated by ";".
const splitTypes = v => (v || "").split(";").map(x => x.trim()).filter(Boolean);

function chip(text, hue, extraClass = "") {
  const span = document.createElement("span");
  span.className = ("label " + extraClass).trim();
  span.style.setProperty("--h", hue);
  span.textContent = text;
  return span;
}

// ---------- formatting ----------

function fmtDate(iso, opts = { month: "short", day: "numeric" }) {
  if (!iso) return "";
  return new Date(iso + "T00:00:00").toLocaleDateString("en-US", opts);
}

function display(key, value) {
  if (key === "status") return STATUSES[value] || value;
  if (key === "detected") return fmtDate(value);
  if (key === "tags") return (value || []).map(tagLabel).join(", ");
  if (key === "website") return value ? value.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "") : "";
  return value ?? "";
}

function cell(key, value, label) {
  const td = document.createElement("td");
  td.className = "k-" + key;
  td.dataset.label = label;   // shown as a prefix in the mobile card layout
  if (key === "website" && value) {
    const a = document.createElement("a");
    a.href = value;
    a.textContent = display(key, value);
    a.target = "_blank";
    a.rel = "noopener";
    td.appendChild(a);
  } else if (key === "tags") {
    for (const id of value || []) td.appendChild(chip(tagLabel(id), tagHue(id), "tag"));
  } else if (key === "type") {
    for (const t of splitTypes(value)) td.appendChild(chip(t, typeHue(t)));
  } else if (key === "status") {
    const span = document.createElement("span");
    span.className = "status s-" + value;
    span.textContent = display(key, value);
    td.appendChild(span);
  } else {
    td.textContent = display(key, value);
  }
  return td;
}

// ---------- fuzzy search ----------

const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// Edit distance where insert, delete, substitute and swapping two adjacent
// letters each count as one typo. Gives up early once it exceeds `max`.
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let best = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1])
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      best = Math.min(best, d[i][j]);
    }
    if (best > max) return max + 1;
  }
  return d[a.length][b.length];
}

// A query token matches a row if it appears anywhere in the row's text.
// Only when a token appears nowhere in the data (likely a typo) do we fall
// back to fuzzy matching: within 1 typo (5+ letters) or 2 typos (7+ letters)
// of a word, or of the start of a word.
function tokenMatches(t, row, fuzzy) {
  if (row.text.includes(t)) return true;
  if (!fuzzy || t.length < 5) return false;
  const max = t.length >= 7 ? 2 : 1;
  return row.words.some(w =>
    lev(t, w, max) <= max || (w.length > t.length && lev(t, w.slice(0, t.length), max) <= max));
}

// ---------- filtering ----------

function apply() {
  const q = $("q").value;
  const saleOnly = $("saleOnly").checked;
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const fuzzy = tokens.map(tok => !rows.some(r => r.text.includes(tok)));
  const shownTags = new Set(tags.filter(t => t.input.checked).map(t => t.id));

  // A brand is shown if any of its tags is ticked and it passes search + sale filter.
  const perTag = Object.fromEntries(tags.map(t => [t.id, 0]));
  let shown = 0;
  for (const r of rows) {
    const passesOther = (!saleOnly || ON_SALE.has(r.data.status)) &&
                        tokens.every((tok, i) => tokenMatches(tok, r, fuzzy[i]));
    if (passesOther) r.data.tags.forEach(id => perTag[id]++);
    const ok = passesOther && r.data.tags.some(id => shownTags.has(id));
    r.el.hidden = !ok;
    if (ok) shown++;
  }
  applyPriceFilters(shownTags);
  // Each checkbox shows how many brands carry that tag under the other filters.
  tags.forEach(t => t.n.textContent = `(${perTag[t.id]})`);
  $("count").textContent = `Showing ${shown} of ${rows.length}`;
  $("empty").hidden = shown > 0;

  // Keep filters in the URL so a filtered view can be shared.
  const url = new URL(location);
  const set = (k, v) => v ? url.searchParams.set(k, v) : url.searchParams.delete(k);
  set("q", q);
  set("sale", saleOnly ? "1" : "");
  set("hide", tags.filter(t => !t.input.checked).map(t => t.id).join(","));
  history.replaceState(null, "", url);
}

// ---------- table ----------

function sortKey(key, value) {
  if (key === "status") {
    const i = STATUS_ORDER.indexOf(value);
    return i === -1 ? STATUS_ORDER.length : i;
  }
  if (key === "tags") return norm(display(key, value));
  return norm(value ?? "");
}

function buildTable() {
  const htr = $("t").tHead.rows[0];
  const tbody = $("t").tBodies[0];
  const sel = $("sortSel"), dirBtn = $("sortDir");
  let current = { col: -1, dir: 1 };

  // Sort by column i (-1 = original order) in direction dir (1 or -1).
  function sortBy(i, dir) {
    current = { col: i, dir };
    const key = i >= 0 ? COLUMNS[i].key : null;
    rows.sort((a, b) => {
      if (!key) return a.idx - b.idx;
      const x = sortKey(key, a.data[key]);
      const y = sortKey(key, b.data[key]);
      if (x === "" && y !== "") return 1;   // blanks always last
      if (y === "" && x !== "") return -1;
      const cmp = typeof x === "number" ? x - y : x.localeCompare(y);
      return cmp * dir || a.idx - b.idx;
    });
    rows.forEach(r => tbody.appendChild(r.el));
    [...htr.cells].forEach((h, j) =>
      h.setAttribute("aria-sort", j === i ? (dir === 1 ? "ascending" : "descending") : "none"));
    sel.value = String(i);
    dirBtn.textContent = dir === 1 ? "↑" : "↓";
    dirBtn.disabled = i < 0;
  }

  COLUMNS.forEach((c, i) => {
    const th = document.createElement("th");
    th.textContent = c.label;
    th.addEventListener("click", () => sortBy(i, current.col === i ? -current.dir : 1));
    htr.appendChild(th);
    sel.add(new Option(c.label, String(i)));
  });
  sel.addEventListener("change", () => sortBy(Number(sel.value), 1));
  dirBtn.addEventListener("click", () => { if (current.col >= 0) sortBy(current.col, -current.dir); });
  dirBtn.disabled = true;

  for (const r of rows) {
    r.el = document.createElement("tr");
    COLUMNS.forEach(c => r.el.appendChild(cell(c.key, r.data[c.key], c.label)));
    tbody.appendChild(r.el);
    const text = norm(COLUMNS.map(c => display(c.key, r.data[c.key])).join(" · "));
    r.text = text;
    r.words = text.split(/[^a-z0-9%]+/).filter(Boolean);
  }

  // Default: brands with active sales first (status order: live, other sale, ...).
  sortBy(COLUMNS.findIndex(c => c.key === "status"), 1);
}

function buildFilters(params) {
  const hidden = new Set((params.get("hide") || "").split(","));
  for (const t of tags) {
    const label = document.createElement("label");
    t.input = document.createElement("input");
    t.input.type = "checkbox";
    t.input.checked = !hidden.has(t.id);
    t.input.addEventListener("change", apply);
    t.n = document.createElement("span");
    t.n.className = "n";
    label.append(t.input, " " + t.label + " ", t.n);
    $("tagFilters").appendChild(label);
  }
  $("saleOnly").checked = params.get("sale") === "1";
  $("saleOnly").addEventListener("change", apply);

  const q = $("q");
  q.value = params.get("q") || "";
  q.addEventListener("input", apply);
  q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; apply(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
}

// ---------- price stats ----------

const priceGroups = [];  // { tag, els } so the tag checkboxes can hide a group

const money = v => "$" + Math.round(v).toLocaleString("en-US");

function median(xs) {
  const a = [...xs].sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function div(cls, ...kids) {
  const d = document.createElement("div");
  d.className = cls;
  d.append(...kids);
  return d;
}

function span(cls, text) {
  const s = document.createElement("span");
  s.className = cls;
  s.textContent = text;
  return s;
}

// A price cell. `o` is the observation it came from (lowest/highest), or null (median).
function priceCell(price, full, o) {
  const v = span("v" + (full > price ? " sale" : ""), money(price));
  const cellEl = div("pval");
  if (o) {
    const a = document.createElement("a");
    a.href = o.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = `${o.brand}: ${o.product}`;
    a.appendChild(v);
    cellEl.append(a, span("by", o.brand));
  } else {
    cellEl.append(v);
  }
  if (full > price) {
    const was = span("was", "was ");
    const s = document.createElement("s");
    s.textContent = money(full);
    was.appendChild(s);
    cellEl.append(was);
  }
  return cellEl;
}

function buildPrices(p) {
  const grid = $("pstats");
  grid.append(div("ph ph-cat", "Category"), div("ph", "Lowest"), div("ph", "Median"), div("ph", "Highest"));

  const byCat = new Map(p.categories.map(c => [c.id, []]));
  for (const o of p.observations) byCat.get(o.category)?.push(o);

  let lastTag = null, group = null, lastRow = [];
  for (const c of p.categories) {
    if (c.tag !== lastTag) {
      lastTag = c.tag;
      group = { tag: c.tag, els: [div("pgroup", chip(tagLabel(c.tag), tagHue(c.tag), "tag"))] };
      priceGroups.push(group);
      grid.append(group.els[0]);
    }
    const obs = byCat.get(c.id);
    const brands = new Set(obs.map(o => o.brand)).size;
    const cat = div("pcat", c.label, span("n", obs.length
      ? `${obs.length} product${obs.length > 1 ? "s" : ""} from ${brands} brand${brands > 1 ? "s" : ""}`
      : ""));
    cat.title = c.description;
    const row = [cat];
    if (!obs.length) {
      row.push(div("pnone", "No prices yet"));
    } else {
      // Lowest and highest are by today's price; ties go to the first one listed.
      const lo = obs.reduce((a, b) => b.price < a.price ? b : a);
      const hi = obs.reduce((a, b) => b.price > a.price ? b : a);
      row.push(
        priceCell(lo.price, lo.full_price, lo),
        priceCell(median(obs.map(o => o.price)), median(obs.map(o => o.full_price)), null),
        priceCell(hi.price, hi.full_price, hi));
    }
    grid.append(...row);
    group.els.push(...row);
    lastRow = row;
  }
  lastRow.forEach(e => e.classList.add("last"));

  $("psub").textContent = p.checked
    ? `From brands' US sites, in US dollars. Last checked ${fmtDate(p.checked, { month: "long", day: "numeric" })}. Sale prices are in green, with the full price below.`
    : "No prices collected yet.";
  $("prices").hidden = false;
}

function applyPriceFilters(shownTags) {
  for (const g of priceGroups) g.els.forEach(e => e.hidden = !shownTags.has(g.tag));
}

// ---------- loading ----------

async function main() {
  let data;
  try {
    const r = await fetch(DATA_URL, { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (err) {
    $("title").textContent = "Couldn't load data";
    $("foot").textContent = err.message +
      ". If you opened this file directly, serve the folder with a local web server instead.";
    return;
  }
  document.title = $("title").textContent = data.title;

  tags.push(...data.tags.map(t => ({ ...t })));
  data.brands.forEach((d, idx) => {
    if (!d.tags?.length) d.tags = ["untagged"];
    // Any tag id not defined at the top still gets a checkbox, labelled by its id.
    d.tags.forEach(id => { if (!tags.some(t => t.id === id)) tags.push({ id, label: id }); });
    rows.push({ data: d, idx });
  });

  $("sub").textContent = data.checked
    ? `Last checked ${fmtDate(data.checked, { month: "long", day: "numeric", year: "numeric" })}`
    : "";
  buildTable();
  try {
    const r = await fetch(PRICES_URL, { cache: "no-cache" });
    if (r.ok) buildPrices(await r.json());
  } catch (err) {
    console.warn("Couldn't load prices:", err);
  }
  buildFilters(new URLSearchParams(location.search));
  apply();

}

main();
</script>
</body>
</html>
