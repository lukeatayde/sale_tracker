<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycling Sale Tracker</title>
<style>
  :root {
    --bg: #fff;
    --fg: #1a1a1a;
    --muted: #666;
    --line: #e5e5e5;
    --head: #f7f7f7;
    --link: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #e8e8e8;
      --muted: #999;
      --line: #2c2c2c;
      --head: #1c1c1c;
      --link: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .controls {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg);
    padding: .5rem 0 .75rem;
  }
  .controls input[type=search] {
    width: 100%;
    font: inherit;
    font-size: 16px; /* below 16px, iOS zooms the page on focus */
    padding: .5rem .75rem;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .controls input[type=search]:focus { outline: 2px solid var(--link); outline-offset: -1px; }
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem 1.1rem;
    margin-top: .6rem; font-size: .9em;
  }
  .filters label { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; white-space: nowrap; }
  .filters input { margin: 0; accent-color: var(--link); }
  .filters .n { color: var(--muted); }
  .filters .sep { width: 1px; align-self: stretch; background: var(--line); }
  .count { color: var(--muted); font-size: .85em; margin-top: .5rem; }

  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .55rem .75rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    background: var(--head);
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--link); }
  th::after { content: " ↕"; color: var(--muted); font-size: .8em; }
  th[aria-sort="ascending"]::after { content: " ↑"; color: inherit; }
  th[aria-sort="descending"]::after { content: " ↓"; color: inherit; }
  .k-name, .k-status, .k-detected, .k-website, .k-category { white-space: nowrap; }
  .k-notes { min-width: 18rem; }
  .k-detected, .k-category { color: var(--muted); }
  .status { font-size: .85em; }
  .status::before { content: "●"; margin-right: .35em; }
  .s-live::before { color: #1f9d55; }
  .s-other_sale::before { color: #d69e2e; }
  .s-not_yet::before { color: #999; }
  .s-unknown::before { color: #999; content: "○"; }
  .s-closed::before { color: #c53030; }
  .empty { color: var(--muted); padding: 1rem 0; }
  footer { color: var(--muted); font-size: .85em; margin-top: 1rem; }

  /* Phones: each row becomes a card, and the header row becomes sort chips. */
  @media (max-width: 760px) {
    body { padding: 1.25rem 16px; }
    h1 { font-size: 1.3rem; }
    .filters .sep { display: none; }
    .wrap { overflow: visible; }
    table, thead, tbody { display: block; }

    thead tr {
      display: flex; gap: .4rem; align-items: center;
      overflow-x: auto; scrollbar-width: none;
      padding: .6rem .75rem;
      background: var(--head);
      border-bottom: 1px solid var(--line);
      font-size: .8em;
    }
    thead tr::-webkit-scrollbar { display: none; }
    thead tr::before { content: "Sort:"; color: var(--muted); margin-right: .1rem; flex: none; }
    th {
      padding: .2rem .55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      font-weight: 500;
    }
    th[aria-sort="ascending"], th[aria-sort="descending"] { border-color: var(--link); color: var(--link); }

    tbody tr {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: .3rem 1rem;
      padding: .8rem .75rem;
      border-bottom: 1px solid var(--line);
    }
    tbody tr:last-child { border-bottom: 0; }
    td { display: block; padding: 0; border: 0; min-width: 0; }
    td:empty { display: none; }

    /* Line 1: name and status. Line 2: notes. Line 3: everything else. */
    td.k-name { order: -2; flex: 1 1 auto; font-weight: 600; white-space: normal; }
    td.k-status { order: -1; flex: 0 0 auto; }
    td.k-notes { flex-basis: 100%; }
    td:not(.k-name):not(.k-status):not(.k-notes) {
      order: 1;
      font-size: .82em;
      color: var(--muted);
      white-space: normal;
    }
    td:not(.k-name):not(.k-status):not(.k-notes):not(.k-website):not(.k-category)::before {
      content: attr(data-label) ": ";
      opacity: .8;
    }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p class="sub" id="sub"></p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search brands, notes, countries… (press /)" autocomplete="off" aria-label="Search">
    <div class="filters" id="filters">
      <span id="cats" style="display:contents"></span>
      <span class="sep"></span>
      <label><input type="checkbox" id="saleOnly"> On sale now only</label>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="wrap"><table id="t"><thead><tr></tr></thead><tbody></tbody></table></div>
  <p class="empty" id="empty" hidden>Nothing matches these filters.</p>
  <footer id="foot"></footer>
</main>
<script>
const DATA_DIR = "data/";

// Status values in sort order, with display labels.
const STATUSES = {
  live:       "Live now",
  other_sale: "Other sale on",
  not_yet:    "Not yet",
  unknown:    "Couldn't check",
  closed:     "Closed",
};
const STATUS_ORDER = Object.keys(STATUSES);
// Statuses that count as "some form of sale going on".
const ON_SALE = new Set(["live", "other_sale"]);

const $ = id => document.getElementById(id);
const rows = [];        // { el, data, category, idx, text, words }
const categories = [];  // { id, title, input, n }
let columns = [];       // combined columns across all tables

// ---------- formatting ----------

function fmtDate(iso, opts = { month: "short", day: "numeric" }) {
  if (!iso) return "";
  return new Date(iso + "T00:00:00").toLocaleDateString("en-US", opts);
}

function display(key, value) {
  if (key === "status") return STATUSES[value] || value;
  if (key === "detected") return fmtDate(value);
  if (key === "website") return value ? value.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "") : "";
  return value ?? "";
}

function cell(key, value, label) {
  const td = document.createElement("td");
  td.className = "k-" + key;
  td.dataset.label = label;   // shown as a prefix in the mobile card layout
  if (key === "website" && value) {
    const a = document.createElement("a");
    a.href = value;
    a.textContent = display(key, value);
    a.target = "_blank";
    a.rel = "noopener";
    td.appendChild(a);
  } else if (key === "status") {
    const span = document.createElement("span");
    span.className = "status s-" + value;
    span.textContent = display(key, value);
    td.appendChild(span);
  } else {
    td.textContent = display(key, value);
  }
  return td;
}

// ---------- fuzzy search ----------

const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Edit distance where insert, delete, substitute and swapping two adjacent
// letters each count as one typo. Gives up early once it exceeds `max`.
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let best = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1])
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      best = Math.min(best, d[i][j]);
    }
    if (best > max) return max + 1;
  }
  return d[a.length][b.length];
}

// A query token matches a row if it appears anywhere in the row's text.
// Only when a token appears nowhere in the data (likely a typo) do we fall
// back to fuzzy matching: within 1 typo (5+ letters) or 2 typos (7+ letters)
// of a word, or of the start of a word.
function tokenMatches(t, row, fuzzy) {
  if (row.text.includes(t)) return true;
  if (!fuzzy || t.length < 5) return false;
  const max = t.length >= 7 ? 2 : 1;
  return row.words.some(w =>
    lev(t, w, max) <= max || (w.length > t.length && lev(t, w.slice(0, t.length), max) <= max));
}

// ---------- filtering ----------

function apply() {
  const q = $("q").value;
  const saleOnly = $("saleOnly").checked;
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const fuzzy = tokens.map(tok => !rows.some(r => r.text.includes(tok)));
  const shownCats = new Set(categories.filter(c => c.input.checked).map(c => c.id));

  const perCat = Object.fromEntries(categories.map(c => [c.id, 0]));
  let shown = 0;
  for (const r of rows) {
    const passesOther = (!saleOnly || ON_SALE.has(r.data.status)) &&
                        tokens.every((tok, i) => tokenMatches(tok, r, fuzzy[i]));
    if (passesOther) perCat[r.category]++;
    const ok = passesOther && shownCats.has(r.category);
    r.el.hidden = !ok;
    if (ok) shown++;
  }
  // Each checkbox shows how many rows it would contribute under the other filters.
  categories.forEach(c => c.n.textContent = `(${perCat[c.id]})`);
  $("count").textContent = `Showing ${shown} of ${rows.length}`;
  $("empty").hidden = shown > 0;

  // Keep filters in the URL so a filtered view can be shared.
  const url = new URL(location);
  const set = (k, v) => v ? url.searchParams.set(k, v) : url.searchParams.delete(k);
  set("q", q);
  set("sale", saleOnly ? "1" : "");
  set("hide", categories.filter(c => !c.input.checked).map(c => c.id).join(","));
  history.replaceState(null, "", url);
}

// ---------- table ----------

function sortKey(key, value) {
  if (key === "status") {
    const i = STATUS_ORDER.indexOf(value);
    return i === -1 ? STATUS_ORDER.length : i;
  }
  return norm(value ?? "");
}

function buildTable() {
  const htr = $("t").tHead.rows[0];
  const tbody = $("t").tBodies[0];
  let current = { col: -1, dir: 1 };
  columns.forEach((c, i) => {
    const th = document.createElement("th");
    th.textContent = c.label;
    th.addEventListener("click", () => {
      current.dir = current.col === i ? -current.dir : 1;
      current.col = i;
      rows.sort((a, b) => {
        const x = sortKey(c.key, a.data[c.key]);
        const y = sortKey(c.key, b.data[c.key]);
        if (x === "" && y !== "") return 1;   // blanks always last
        if (y === "" && x !== "") return -1;
        const cmp = typeof x === "number" ? x - y : x.localeCompare(y);
        return cmp * current.dir || a.idx - b.idx;
      });
      rows.forEach(r => tbody.appendChild(r.el));
      [...htr.cells].forEach((h, j) =>
        h.setAttribute("aria-sort", j === i ? (current.dir === 1 ? "ascending" : "descending") : "none"));
    });
    htr.appendChild(th);
  });
  for (const r of rows) {
    r.el = document.createElement("tr");
    columns.forEach(c => r.el.appendChild(cell(c.key, r.data[c.key], c.label)));
    tbody.appendChild(r.el);
    const text = norm(columns.map(c => display(c.key, r.data[c.key])).join(" · "));
    r.text = text;
    r.words = text.split(/[^a-z0-9%]+/).filter(Boolean);
  }
}

function buildFilters(params) {
  const hidden = new Set((params.get("hide") || "").split(","));
  for (const c of categories) {
    const label = document.createElement("label");
    c.input = document.createElement("input");
    c.input.type = "checkbox";
    c.input.checked = !hidden.has(c.id);
    c.input.addEventListener("change", apply);
    c.n = document.createElement("span");
    c.n.className = "n";
    label.append(c.input, " " + c.title + " ", c.n);
    $("cats").appendChild(label);
  }
  $("saleOnly").checked = params.get("sale") === "1";
  $("saleOnly").addEventListener("change", apply);

  const q = $("q");
  q.value = params.get("q") || "";
  q.addEventListener("input", apply);
  q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; apply(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
}

// ---------- loading ----------

async function getJSON(file) {
  const r = await fetch(DATA_DIR + file, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${file}: HTTP ${r.status}`);
  return r.json();
}

async function main() {
  let manifest;
  try {
    manifest = await getJSON("index.json");
  } catch (err) {
    $("title").textContent = "Couldn't load data";
    $("foot").textContent = err.message +
      ". If you opened this file directly, serve the folder with a local web server instead.";
    return;
  }
  document.title = $("title").textContent = manifest.title;

  const results = await Promise.allSettled(manifest.tables.map(getJSON));
  const errors = [];
  // Combined columns: every key used by any table, in first-seen order, with a
  // Category column after the name.
  const seen = new Map([["name", "Name"], ["category", "Category"]]);
  let checked = "";
  results.forEach((res, i) => {
    const file = manifest.tables[i];
    if (res.status !== "fulfilled") { errors.push(res.reason.message); return; }
    const t = res.value;
    const id = file.replace(/\.json$/, "");
    categories.push({ id, title: t.title });
    if (t.checked > checked) checked = t.checked;
    t.columns.forEach(c => { if (!seen.has(c.key)) seen.set(c.key, c.label); });
    t.rows.forEach(d => rows.push({ data: { ...d, category: t.title }, category: id, idx: rows.length }));
  });
  columns = [...seen].map(([key, label]) => ({ key, label }));

  $("sub").textContent = (checked ? `Last checked ${fmtDate(checked, { month: "long", day: "numeric", year: "numeric" })}. ` : "") +
    "Click a column to sort. Search tolerates typos.";
  buildTable();
  buildFilters(new URLSearchParams(location.search));
  apply();

  const live = rows.filter(r => r.data.status === "live").length;
  const onSale = rows.filter(r => ON_SALE.has(r.data.status)).length;
  $("foot").textContent = `${rows.length} entries · ${live} Black Friday sales live · ${onSale} with some sale on` +
    (errors.length ? ` · couldn't load: ${errors.join(", ")}` : "");
}

main();
</script>
</body>
</html>
